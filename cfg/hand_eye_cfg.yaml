aimrt:
  configurator:
    temp_cfg_path: ./.log/cfg/tmp
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
      - type: rotate_file
        options:
          path: ./.log
          filename: hand_eye.log
          max_file_size_m: 4
          max_file_num: 10
  executor:
    executors:
      - name: work_thread_pool
        type: asio_thread
        options:
          thread_num: 2
  module:
    modules:
      - name: HandEyeModule
        log_lvl: INFO
  plugin:
    plugins:
      # - name: net_plugin
      #   path: ${AIMRT_PLUGIN_DIR}/libaimrt_net_plugin.so
      #   options:
      #     thread_num: 2
      #     tcp_options:
      #       listen_ip: 127.0.0.1
      #       listen_port: 50081
      - name: zenoh_plugin
        path: ${AIMRT_PLUGIN_DIR}/libaimrt_zenoh_plugin.so

  channel:
    backends:
      - type: zenoh
    pub_topics_options:
      - topic_name: "(.*)" # 正则表达式
        enable_backends: []
        enable_filters: []
    sub_topics_options:
      - topic_name: "(.*)" # 正则表达式
        enable_backends: [zenoh]
        enable_filters: []

# Module custom configuration
HandEyeModule:
  work_executor: work_thread_pool
  sub_cart_pose_topic: /geniarm/pose_current

  mode: motion_only

  # ---- 手眼标定参数----

  camera:
    type: orbbec_gemini305
    color_width: 1280
    color_height: 720
    fps: 30

  calibration:
    aruco:
      marker_length_m: 0.1
      dict_id: 0
      target_marker_id: 0
    hand_eye_method: TSAI

  # ---- 画面显示：rerun ----
  rerun:
    enabled: true
    grpc_port: 9876            # PC 上执行：rerun rerun+http://<机器人IP>:9876
    jpeg_quality: 80           # 720p@30fps 下约 5.4 MB/s
    log_every_n_frames: 1      # 省 CPU / 带宽时调大
    save_rrd: ""               # 填路径则同时落一份 .rrd 便于回放
