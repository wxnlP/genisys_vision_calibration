aimrt:
  configurator:
    temp_cfg_path: ./.log/cfg/tmp
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
      - type: rotate_file
        options:
          path: ./.log
          filename: hand_eye.log
          max_file_size_m: 4
          max_file_num: 10
  executor:
    executors:
      - name: work_thread_pool
        type: asio_thread
        options:
          thread_num: 2
  module:
    modules:
      - name: HandEyeModule
        log_lvl: INFO
  plugin:
    plugins:
      # - name: net_plugin
      #   path: ${AIMRT_PLUGIN_DIR}/libaimrt_net_plugin.so
      #   options:
      #     thread_num: 2
      #     tcp_options:
      #       listen_ip: 127.0.0.1
      #       listen_port: 50081
      - name: zenoh_plugin
        path: ${AIMRT_PLUGIN_DIR}/libaimrt_zenoh_plugin.so

  channel:
    backends:
      - type: zenoh
    pub_topics_options:
      - topic_name: "(.*)" # 正则表达式
        enable_backends: []
        enable_filters: []
    sub_topics_options:
      - topic_name: "(.*)" # 正则表达式
        enable_backends: [zenoh]
        enable_filters: []

# Module custom configuration
HandEyeModule:
  work_executor: work_thread_pool
  sub_cart_pose_topic: /geniarm/pose_current
